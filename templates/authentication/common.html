{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Authentication System</title>
    <link rel="mask-icon" href="https://github.githubassets.com/assets/pinned-octocat-093da3e6fa40.svg" color="#000000">
    <link rel="alternate icon" class="js-site-favicon" type="image/png"
        href="https://github.githubassets.com/favicons/favicon.png">
    <link rel="icon" class="js-site-favicon" type="image/svg+xml"
        href="https://github.githubassets.com/favicons/favicon.svg">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-XYZ" crossorigin="anonymous" />
    <link rel="stylesheet" href="{% static 'authentication/style.css' %}">
    <style>
        :root {
            --box-color: rgb(255, 255, 255);
            --card-text: rgb(73, 73, 73);
        }

        body {
            background-color: rgb(255, 255, 255) !important;
            background-image: url();
            background-attachment: fixed;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-clip: content-box;
            backdrop-filter: blur(3px) !important;
            height: 100vh;



        }

        h1 {
            color: var(--card-text) !important;
        }

        @media only screen and (max-width: 700px) {
            h1 {
                font-size: 60px !important;
            }
        }

        .btn {
            border-radius: 18px;
        }

        #signin-box {
            width: 100%;
            max-width: 500px;

            background-color: var(--box-color) !important;
            border-radius: 20px;
            color: black !important;


        }

        .box-shedow {

            -webkit-box-shadow: -1px 1px 18px -1px rgba(0, 0, 0, 0.31);
            -moz-box-shadow: -1px 1px 18px -1px rgba(0, 0, 0, 0.31);
            box-shadow: -1px 1px 18px -1px rgba(0, 0, 0, 0.31);
        }

        #signin-center {
            width: 100%;
            height: 90vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        button {
            width: 270px;
            height: 40px;
            font-size: 14px !important;
        }
    </style>
</head>

<body>


  <!-- start loader -->
  <section>
    <style>
      /* styles.css */

      /* Loader styles */

      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgb(255, 255, 255);
        /* Semi-transparent white background */
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        /* Ensure loader is on top of everything */
      }

      .loader-icon {
        border: 8px solid #f3f3f3;
        /* Light gray border */
        border-top: 8px solid #3498db;
        /* Blue border on top */
        border-radius: 50%;
        width: 50px;
        height: 50px;
        animation: spin 1s linear infinite;
        /* Animation for spinning */
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      /* Hide loader when content is loaded */
      .loaded .loader {
        display: none;
      }
    </style>
    <!-- Loader -->
    <div class="loader">
      <!-- You can customize the loader animation or icon here -->
      <div class="loader-icon"></div>
    </div>

    <script>
      // script.js

      // Function to hide the loader when all content is loaded
      window.addEventListener('load', function () {
        const loader = document.querySelector('.loader');
        loader.parentElement.classList.add('loaded'); // Add 'loaded' class to the parent element of loader
      });

    </script>

  </section>
  <!-- loader end -->



    <div class="d-flex position-absolute flex-direction-row w-100 mt-2">
        <div class="container">
            {% for message in messages %}
            <div class="alert  alert-{{ message.tags }} alert-dismissible fade show alert-info " role="alert">
                <strong>{{ message.tags }}</strong> {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
    </div>
    <div>
        {% block content %}

        {% endblock content %}
    </div>

</body>

</html>
