{% extends "authentication/common.html" %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="{% static 'authentication/style.css' %}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<style>
    /* #signin-box {
        width: 100%;
        max-width: 500px;

        background-color: rgba(255, 255, 255, 0.308);
        border-radius: 20px;
    } */

    #signin-center {
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    button {
        width: 270px;
        height: 40px;
        font-size: 14px !important;
    }
</style>
</head>

<body>
    <div class="d-flex position-absolute flex-direction-row w-100 mt-2">
        <div class="container">
            {% for message in messages %}
            <div class="alert  alert-{{ message.tags }} alert-dismissible fade show alert-info " role="alert">
                <strong>{{ message.tags }}</strong> {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
        </div>
    </div>

    <div id="signin-center">
        <div id="signin-box" class=" m-5 p-5 box-shedow">

            <h1 class="h3 mb-3 fw-normal " style="color: var(--card-text);">Sign In</h1>
            <div class="d-flex flex-column flex-md-row">
                <div class="col-md-12 col-12 mb-3 mb-md-0">
                    <form action="" method="post" class="form-signin mt-md-3">
                        {% csrf_token %}
                        <div class="form-floating mb-2">
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username"
                                required>
                            <label for="username">Username</label>
                        </div>
                        <div class="form-floating mb-2">
                            <input type="password" class="form-control" id="pass1" name="pass1" placeholder="Password"
                                required>
                            <label for="pass1">Password</label>
                            <span class="position-absolute top-50 end-0 translate-middle-y me-3" id="togglePassword"
                                style="cursor: pointer;">
                                <i class="fas fa-eye-slash"></i>
                            </span>
                        </div>
                        <div class="d-flex w-100 justify-content-center align-item-center pt-5">
                            <button type="submit" class="btn btn-lg btn-primary">Sign In</button>
                        </div>

                    </form>

                    <div class="d-flex w-100 justify-content-center align-item-center pt-1">
                        <a href="signup"><button class="btn btn-lg btn-primary">Sign Up</button> </a>

                    </div>
                    <div class="d-flex flex-column w-100 justify-content-center text-center align-item-center ">
                        <!--                        <a href="login" class="text-white">-->
                        <!--                            <button class="btn btn-lg btn-primary mt-1">QR code authenticator</button>-->

                        <!--                        </a>-->
                        <a href="forgot-password/" class="text-decoration-none  pt-1"
                            style="color: var(--card-text) !important;">Do you forgot password
                            ?</a>
                    </div>

                </div>

            </div>
        </div>
    </div>



    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <!-- Custom JS for toggling password visibility -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const togglePassword = document.querySelector('#togglePassword');
            const password = document.querySelector('#pass1');

            togglePassword.addEventListener('click', function (e) {
                // Toggle the type attribute
                const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                password.setAttribute('type', type);
                // Toggle the eye / eye slash icon
                this.querySelector('i').classList.toggle('fa-eye-slash');
                this.querySelector('i').classList.toggle('fa-eye');

            });
        });
    </script>
</body>

</html>
{% endblock %}
