{% extends "authentication/common.html" %}
{% load static %}
{% block content %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="{% static 'authentication/style.css' %}">
    <style>
        body {
            background-color: black;
        }

        #signin-box {
            width: 100%;
            max-width: 500px;

            background-color: rgba(255, 255, 255, 0.308);
            border-radius: 20px;
        }

        #signin-center {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            width: 270px;
            height: 40px;
            font-size: 14px !important;
        }
    </style>
</head>

<body>

    <div id="signin-center">
        <div id="signin-box" class=" m-5 p-5 box-shedow">
            <i class="fas fa-american-sign-language-interpreting fa-5x text-primary"></i>
            <h1 class="h3 mb-3 fw-normal " style="color: var(--card-text);">Authenticator OTP</h1>
            <div class="d-flex flex-column flex-md-row">
                <div class="col-md-12 col-12 mb-3 mb-md-0">
                    <form action="" method="post" class="form-signin mt-md-3">
                        {% csrf_token %}
                        <!--                        <div class="form-floating mb-2">-->
                        <!--                            <input type="text" class="form-control" id="username" name="username" placeholder="Username"  required>-->
                        <!--                            <label for="username">Username</label>-->
                        <!--                        </div>-->
                        <div class="form-floating mb-2">
                            <input type="password" class="form-control" id="pass1" name="otp" placeholder="OTP"
                                required>
                            <label for="pass1">Authenticator OTP</label>
                        </div>
                        <div class="d-flex w-100 justify-content-center align-item-center pt-5">
                            <button type="submit" class="btn btn-lg btn-primary">Sign In</button>
                        </div>
                    </form>
                    {% comment %} <div
                        class="d-flex flex-column w-100 justify-content-center text-center align-item-center ">
                        <a href="login" class="text-white">
                            <button class="btn btn-lg btn-primary mt-1">QR code authenticator</button>

                        </a>
                        <a href="signup" class="text-decoration-none text-white pt-1">Do you wanna create account ?</a>
                    </div> {% endcomment %}

                </div>

            </div>
        </div>
    </div>
</body>

</html>
{% endblock %}
