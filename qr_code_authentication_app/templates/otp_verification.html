<!-- templates/otp_verification.html -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTP Verification</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #f0f0f0; /* Light background color */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333; /* Darker text color for better readability */
            font-family: 'Arial', sans-serif;
        }

        .card {
            max-width: 400px;
            padding: 2rem;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Soft shadow */
            background-color: #fff;
            border-radius: 10px;
        }

        .btn {
            border-radius: 18px;
        }

        .qr-code {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        @media only screen and (max-width: 700px) {
            .card {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <!-- Messages Display -->
        <div class="mt-2">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    <strong>{{ message.tags }}</strong> {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        </div>

        <div class="d-flex flex-wrap">

        <!-- Main Content -->
        <div class="card">
            <div class="qr-code d-flex justify-content-center">
                <!-- Vector Graphics (replace with your SVG graphics) -->
                <img src="data:image/png;base64,{{ img_str }}" alt="QR Code" width="250px">
            </div>

            <p class="mt-3">Use Google Authenticator App to Scan QR Code</p>
            <a href="/home" class="btn btn-success mt-3">Go Back</a>
        </div>


        </div>


    <!-- Bootstrap JS Bundle (needed for Bootstrap components) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
